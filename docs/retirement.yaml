# Machine-readable retirement ledger. See DATA_RETIREMENT.md for the reasoning.
#
# An entry is actionable when:
#   retire_when.min_prod_version_code <= <the versionCode currently in prod>
#   AND every id in blocked_by has status: retired
#
# Gates are versionCode from app/build.gradle.kts, and refer to the OLDEST build still
# receiving users — not the newest one merged. Never retire on judgement; if an entry's
# gate has not been reached, report it as pending and stop.

version: 1
current_version_code: 385          # update on every release
current_version_name: "3.0.85"

entries:
  - id: lfs-prepopulated-asset
    status: retired
    retired_in_version_code: 385
    summary: Stop tracking the 140 MB prepopulated database in git.
    retire_when:
      min_prod_version_code: 379
      because: >
        From 379 the artifact is fetched from arshad-shah/nimaz-data and verified by sha256
        at build time, so nothing reads the tracked asset. It goes with the release that
        introduces the fetch rather than a release later, because no installed device ever
        reads it — only the build does.
    blocked_by: []
    steps:
      - git rm --cached app/src/main/assets/database/nimaz_prepopulated.db
      - Remove the `*.db filter=lfs` line from .gitattributes.
      - Confirm data.lock.json pins the artifact the deleted file was providing.
    verify:
      - ./gradlew :app:assembleDebug
      - test ! -f app/src/main/assets/database/nimaz_prepopulated.db
    retirement_notes: >
      The steps were already performed in 0b37228 (#328), the release that introduced the
      fetch — the asset and the LFS rule went with it, and .gitattributes is now empty. Only
      the status field was left behind. data.lock.json pins data-v7 at schemaVersion 23, whose
      assetPath is the database/nimaz_prepopulated.db the deleted file used to provide.

  - id: hadith-backfill-seeder
    status: retired
    retired_in_version_code: 385
    summary: Delete HadithBackfillSeeder and its 773 KB fills asset.
    retire_when:
      min_prod_version_code: 380
      because: >
        The 379 repairs are folded into the corpus sources, so the artifact ships them already
        applied and ContentPatchSeeder carries them to upgraders. One release of overlap so a
        device upgrading from 378 has run at least one of the two paths.
    blocked_by: [lfs-prepopulated-asset]
    steps:
      - Delete data/local/hadith/HadithBackfillSeeder.kt and its test.
      - Delete app/src/main/assets/hadith/hadith_fills.json.
      - Remove its binding from the Hilt module and its call from the startup seeding path.
      - Drop the hadithBackfillVersion key from PreferencesDataStore.
    verify:
      - ./gradlew :app:compileDebugKotlin
      - ./gradlew :app:testDebugUnitTest --tests '*DeviceStateCorpusTest*'
    retirement_notes: >
      All 379 fills were checked against the corpus before deleting: every `reference` resolves
      in hadith.book-1..6, `text_arabic` is byte-identical to the fill payload, and no fill
      carried a curated narratorChain. The compiled artifact answers 0 to the seeder's own
      guard, `SELECT COUNT(*) FROM hadiths WHERE TRIM(text_arabic) = ''` — so it had already
      become a no-op. That assertion moved into DeviceStateCorpusTest rather than being lost.
      The backfill-only DAO ops (emptyArabicCount, backfillHadith, updateNarratorChain) went
      with it; narrator_chain is still read and rendered, it just has no runtime writer.

  - id: quran-translation-seeder
    status: retired
    retired_in_version_code: 385
    summary: Delete QuranTranslationSeeder and the 18 MB of translation JSON assets.
    retire_when:
      min_prod_version_code: 381
      because: >
        Lazy seeder — it populates a translation only when the user first reads it, so an
        install at 380 may hold only Saheeh International. 381 is the first release by which
        every upgrading device has had a full release of the artifact carrying all 15.
    blocked_by: [lfs-prepopulated-asset]
    steps:
      - Delete data/local/quran/QuranTranslationSeeder.kt and its tests.
      - Delete app/src/main/assets/quran/translations/.
      - Remove seededTranslationId(...) resolution from QuranRepositoryImpl.
      - Remove the Hilt binding and TranslationContentVersionStore.
    verify:
      - ./gradlew :app:compileDebugKotlin
      - ./gradlew :app:testDebugUnitTest
      - Confirm all 15 translations are readable in the app from a fresh install.
    retirement_notes: >
      The 15 tr.* collections diff exactly against the QuranTranslation enum's ids, and each
      holds 6236 rows with a matching floor; the compiled artifact carries 93540 translation
      rows across 15 distinct translator_ids. seededTranslationId was kept rather than removed
      and renamed to translationId — it also normalises an unknown id to DEFAULT via
      fromId(), which is real behaviour that outlives the seeding it used to do. The catalogue
      contract tests in QuranTranslationTest survive; only the assertion that read the deleted
      assets went, because the id-set half is asserted where the data lives.

  - id: mushaf-layout-seeder
    status: retired
    retired_in_version_code: 385
    summary: Delete MushafLayoutSeeder and the 12 MB of mushaf layout/glyph assets.
    retire_when:
      min_prod_version_code: 381
      because: >
        Lazy seeder, same argument as translations: the 3 non-Madani editions populate only
        when a user selects them, so convergence needs a full release of the artifact.
    blocked_by: [lfs-prepopulated-asset]
    steps:
      - Delete data/local/quran/MushafLayoutSeeder.kt and its tests.
      - Delete app/src/main/assets/quran/mushaf/.
      - Remove mushafSeeder.seedIfNeeded(script) from QuranRepositoryImpl.getMushafPageLayout.
      - Remove the Hilt binding and MushafContentVersionStore.
    verify:
      - ./gradlew :app:compileDebugKotlin
      - ./gradlew :app:testDebugUnitTest --tests '*MushafLayoutFidelityTest*'
      - Confirm all 4 editions render from a fresh install.
    retirement_notes: >
      Layout row counts match the deleted assets exactly (15916 / 13804 / 13970) and the four
      text sources hold 6236 each. MushafScript.MADANI has no stored layout at all, so the
      three IndoPak collections are the complete set rather than a partial one.
      MushafLayoutFidelityTest named in `verify` was deleted, not run: every one of its twelve
      assertions read `assets/quran/mushaf/`, and it cannot be rewritten without the artifact.
      Its invariants are blocking rules in the data repo (page.lines-complete, word_range,
      pages_contiguous, distinct/populated scripts) plus each collection's row floor. The one
      genuinely app-side claim — that stored layouts agree with MushafScript on lines per
      page — moved into DeviceStateCorpusTest, which does have the artifact. Worth knowing:
      the data repo declares its own LINES_PER_PAGE mirror of the enum, so app and corpus each
      assert against a copy. That test is what catches the two drifting apart.

  - id: help-dua-qaida-seeders
    status: retired
    retired_in_version_code: 385
    summary: Delete the Help, Dua and Qaida content seeders and their assets.
    retire_when:
      min_prod_version_code: 381
      because: >
        Eager seeders, so they converge on first launch after upgrade; 381 is one full release
        after the artifact carries their content. Grouped because they share the
        content-version-gate pattern and retire identically.
    blocked_by: [lfs-prepopulated-asset]
    steps:
      - Delete HelpContentSeeder, DuaContentSeeder, QaidaContentSeeder and their tests.
      - Delete assets/help/, assets/duas/, assets/qaida/.
      - Remove their Hilt bindings, version stores and startup calls.
    verify:
      - ./gradlew :app:compileDebugKotlin
      - ./gradlew :app:testDebugUnitTest
    retirement_notes: >
      Every count matches the deleted assets: 12 help topics, 43 dua categories, 311 duas, and
      17/29/137/434 qaida lessons/letters/lines/cells. The `seededFlow` helper in the Help and
      Dua repositories was kept as `deferredFlow` rather than inlined — it also defers building
      the DAO flow until collection, which callers depend on. DuaJsonDto and QaidaJsonDto were
      fully orphaned and went too; HelpJsonDto kept only its `helpJson` parser, which
      HelpRepositoryImpl still uses for the pathLabels column. NightPrayerDuaContentTest was
      deleted with the asset it read.

  - id: upstream-generator-scripts
    status: retired
    retired_in_version_code: 385
    summary: Repoint or delete the catalogue drift guards that reference nimaz-pro-data/scripts/.
    retire_when:
      min_prod_version_code: 380
      because: >
        Those scripts now live in arshad-shah/nimaz-data under upstream/scripts/. The guard
        must point at the new repo or be replaced by `nz import --check`, which is the same
        assertion made where the data actually lives.
    blocked_by: []
    steps:
      - Update the QuranTranslation.kt doc comment to reference the data repo.
      - Replace the download_translations.py --check drift guard with nz import --check in CI.
    verify:
      - ./gradlew :app:compileDebugKotlin
      - grep -r 'nimaz-pro-data' app/src docs || true   # expect no hits
    retirement_notes: >
      The QuranTranslation.kt step was already done. The remaining guard was
      .github/workflows/tajweed_data_checks.yml, which triggered on `nimaz-pro-data/**` and ran
      three verify scripts from that tree — a path that cannot change again in this repo. It
      was deleted rather than repointed: the data repo's own checks.yml already runs
      `nz import --check` for source reproducibility and the rules engine via `nz build`, which
      is where the tajweed assertions now live. `verify` expects no `nimaz-pro-data` hits in
      app/src (true) or docs — docs/superpowers/ and docs/nimaz-pro-*.md still mention it, but
      those are historical design records and are meant to.

  - id: git-history-purge
    status: pending
    summary: Rewrite git history to drop nimaz-pro-data/ and every .db blob (~576 MB -> ~30 MB).
    retire_when:
      min_prod_version_code: 380
      because: >
        Destructive and irreversible — every commit SHA changes and all 32 remote branches are
        invalidated. Only safe once the data repo is proven in practice: the artifact fetch
        green in CI and at least one release actually shipped from it.
    blocked_by: [lfs-prepopulated-asset]
    steps:
      - Take a full mirror backup clone and keep it until the rewrite is confirmed good.
      - git filter-repo --path nimaz-pro-data --path app/src/main/assets/database
        --path app/src/main/assets/databases --invert-paths
      - Delete .git/lfs; force-push; re-clone every working copy.
    verify:
      - du -sh .git    # expect roughly 30 MB
      - ./gradlew :app:assembleDebug
    caveats:
      - >
        GitHub does not delete orphaned LFS objects on force-push. Reclaiming the storage
        quota needs a support request or a re-created repository; the rewrite alone does not
        achieve it.
    held_because: >
      Gate passed at 385 and its blocker is retired, so this is the one entry left actionable
      by the ledger's own rule — deliberately not performed. Unlike every other entry, nothing
      here can be checked before the fact: the failure mode is not an empty table a test can
      name but 32 invalidated branches and every commit SHA in every review, issue and release
      note pointing at nothing. It rewrites shared history and force-pushes, so it needs a
      human to say so explicitly and to pick the moment when no one has work in flight. Ask
      before running it; do not treat this note as a reason to drop the entry.
