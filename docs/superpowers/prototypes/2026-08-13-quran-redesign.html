<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nimaz — Quran system, full prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --teal-400:#2DD4BF; --teal-500:#14B8A6; --teal-600:#0D9488; --teal-700:#0F766E;
  --teal-800:#115E59; --teal-950:#042F2E;
  --gold:#EAB308; --gold-dark:#CA8A04;
  --meccan:#8D6E63; --medinan:#00796B; --violet:#8B5CF6; --rose:#D3392C;
  --bg:#F4F7F7; --surface:#FFFFFF; --surface-2:#EDF2F2;
  --ink:#0A1F1E; --ink-2:#41605D; --ink-3:#7A9491;
  --line:rgba(4,47,46,.10); --line-2:rgba(4,47,46,.05);
  --shadow:0 1px 2px rgba(4,47,46,.05), 0 8px 24px -12px rgba(4,47,46,.18);
  --accent:var(--teal-600); --radius:20px;
}
[data-theme="dark"]{
  --bg:#061412; --surface:#0D2321; --surface-2:#12302D;
  --ink:#E4F2F0; --ink-2:#9FBCB8; --ink-3:#6E8B88;
  --line:rgba(224,242,240,.12); --line-2:rgba(224,242,240,.06);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  --accent:var(--teal-400); --meccan:#BCAAA4; --medinan:#4DB6AC; --rose:#EF9A9A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;padding:26px 16px 60px;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;text-align:left}
input{font:inherit}
:focus-visible{outline:2px solid var(--teal-500);outline-offset:2px;border-radius:8px}
svg{display:block;flex:0 0 auto}

.harness{width:100%;max-width:392px;display:flex;flex-direction:column;gap:12px}
.hbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hbtn{font-family:'Outfit';font-size:12px;font-weight:500;padding:7px 12px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.hbtn.on{background:var(--teal-700);border-color:var(--teal-700);color:#fff}
.crumb{font-family:'Outfit';font-size:11.5px;color:var(--ink-3);margin-left:auto;font-weight:500}
.note{font-size:11.5px;color:var(--ink-3);line-height:1.5}

.phone{position:relative;overflow:hidden;background:var(--bg);border:1px solid var(--line);
  border-radius:34px;box-shadow:var(--shadow);height:800px}
#stage{position:absolute;inset:0}
.screen{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;
  transform:translateX(0);transition:transform .26s cubic-bezier(.32,.72,0,1)}
.screen.enter{transform:translateX(100%)}
.screen.under{transform:translateX(-22%)}

/* chrome */
.appbar{display:flex;align-items:center;gap:2px;padding:15px 8px 8px 6px;flex:0 0 auto;background:var(--bg);z-index:4}
.appbar h1{font-family:'Outfit';font-size:19px;font-weight:600;letter-spacing:-.015em;margin:0;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .sub{font-family:'Plus Jakarta Sans';font-size:11.5px;font-weight:400;color:var(--ink-3);display:block;margin-top:1px}
.ico{width:40px;height:40px;display:grid;place-items:center;border-radius:13px;color:var(--ink-2)}
.ico:hover{background:var(--surface-2)}
.body{flex:1;overflow-y:auto;padding:0 16px 44px;scroll-behavior:smooth}
.body::-webkit-scrollbar{width:0}
.stack{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 4px 8px}
.sect .t{font-family:'Outfit';font-size:12.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.sect .l{font-family:'Outfit';font-size:12.5px;font-weight:600;color:var(--accent)}
.empty{padding:36px 20px;text-align:center;color:var(--ink-3);font-size:13.5px;line-height:1.6}

/* home hero */
.cont{border-radius:var(--radius);padding:20px;color:#EAF7F5;width:100%;display:block;
  background:linear-gradient(135deg,var(--teal-800),var(--teal-950));border:1px solid var(--teal-700)}
.cont .eye{font-family:'Outfit';font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--gold)}
.cont .nm{font-family:'Outfit';font-size:22px;font-weight:600;letter-spacing:-.015em;margin-top:8px}
.cont .ar{font-family:'Amiri';font-size:26px;margin-top:2px;direction:rtl;color:rgba(234,247,245,.92)}
.cont .mt{font-size:12.5px;color:rgba(234,247,245,.7);margin-top:12px;font-variant-numeric:tabular-nums}
.cont .bar{height:4px;border-radius:99px;background:rgba(255,255,255,.16);margin-top:10px;overflow:hidden}
.cont .fill{height:100%;background:linear-gradient(90deg,var(--gold-dark),var(--gold))}
.cont .cta{display:flex;align-items:center;gap:6px;margin-top:13px;font-family:'Outfit';font-size:13.5px;font-weight:600;color:#fff}

/* rows */
.rowset{overflow:hidden}
.qrow{display:flex;align-items:center;gap:13px;padding:15px 16px;width:100%}
.qrow + .qrow{border-top:1px solid var(--line-2)}
.qico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:0 0 auto}
.qtxt{flex:1;min-width:0}
.qtxt .t{font-family:'Outfit';font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.qtxt .s{font-size:12px;color:var(--ink-3);margin-top:2px}
.badge{font-family:'Outfit';font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;
  background:var(--surface-2);color:var(--ink-2);font-variant-numeric:tabular-nums}

/* verse of day */
.votd{padding:18px}
.votd .ar{font-family:'Amiri';font-size:23px;line-height:2;text-align:right;direction:rtl}
.votd .tr{font-size:13.5px;line-height:1.6;color:var(--ink-2);margin-top:12px}
.votd .rf{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line-2)}
.votd .rf b{font-family:'Outfit';font-size:12.5px;font-weight:600;color:var(--accent)}

/* horizontal strip */
.strip{display:flex;gap:10px;overflow-x:auto;padding:2px 4px 8px}
.strip::-webkit-scrollbar{height:0}
.sv{flex:0 0 166px;background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:13px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.sv .k{font-family:'Outfit';font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.sv .r{font-family:'Outfit';font-size:14px;font-weight:600}
.sv .e{font-size:11.5px;color:var(--ink-3);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* search */
.searchwrap{padding:0 16px 10px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
  border-radius:15px;padding:11px 14px;box-shadow:var(--shadow)}
.search input{flex:1;border:none;outline:none;background:none;font-size:14.5px;color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.jumpto{margin:0 16px 10px;padding:13px 15px;border-radius:15px;background:rgba(20,184,166,.10);
  border:1px solid rgba(20,184,166,.3);display:flex;align-items:center;gap:12px;width:calc(100% - 32px)}
.jumpto .t{flex:1;font-size:12.5px;color:var(--ink-2)}
.jumpto .t b{font-family:'Outfit';font-weight:600;color:var(--ink);display:block;font-size:14.5px;margin-bottom:2px}
.jumpto .go{font-family:'Outfit';font-size:12.5px;font-weight:600;color:var(--accent)}

/* surah list */
.juzhead{display:flex;align-items:center;gap:10px;padding:16px 6px 8px;position:sticky;top:0;background:var(--bg);z-index:2}
.juzhead .n{font-family:'Outfit';font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.juzhead .rule{flex:1;height:1px;background:var(--line)}
.juzhead .ar{font-family:'Amiri';font-size:15px;color:var(--gold-dark)}
[data-theme="dark"] .juzhead .ar{color:var(--gold)}
.surah{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;background:var(--surface);
  border:1px solid var(--line);border-radius:16px;margin-bottom:8px}
.surah-n{width:34px;height:34px;display:grid;place-items:center;font-family:'Outfit';font-size:12.5px;
  font-weight:600;color:var(--ink-2);background:var(--surface-2);border-radius:11px;font-variant-numeric:tabular-nums;flex:0 0 auto}
.surah-b{flex:1;min-width:0}
.surah-nm{font-family:'Outfit';font-size:15px;font-weight:600;letter-spacing:-.01em}
.surah-mt{font-size:11.5px;color:var(--ink-3);margin-top:3px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.tag{display:inline-flex;align-items:center;gap:4px}
.tag i{width:6px;height:6px;border-radius:99px;display:block}
.surah-ar{font-family:'Amiri';font-size:20px;direction:rtl;white-space:nowrap}
.surah-i{width:30px;height:30px;display:grid;place-items:center;border-radius:10px;color:var(--ink-3);flex:0 0 auto}
.surah-i:hover{background:var(--surface-2)}

/* reader */
.readerbar{display:flex;align-items:center;gap:8px;padding:0 16px 10px}
.anchor{flex:1;display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:10px 14px;box-shadow:var(--shadow)}
.anchor .l{flex:1}
.anchor .t{font-family:'Outfit';font-size:14px;font-weight:600}
.anchor .s{font-size:11.5px;color:var(--ink-3);margin-top:1px;font-variant-numeric:tabular-nums}
.anchor .go{font-family:'Outfit';font-size:12px;font-weight:600;color:var(--accent)}
.ayah{padding:16px 4px;border-bottom:1px solid var(--line-2);width:100%}
.ayah .num{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;
  padding:0 7px;border-radius:9px;background:var(--surface-2);color:var(--ink-2);font-family:'Outfit';
  font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;margin-bottom:10px}
.ayah .marks{float:right;display:flex;gap:6px;margin-top:3px}
.ayah .ar{font-family:'Amiri';font-size:25px;line-height:2.15;text-align:right;direction:rtl;clear:both}
.ayah .tr{font-size:13.5px;line-height:1.65;color:var(--ink-2);margin-top:10px}
.ayah.sel{background:var(--surface);border-radius:14px;padding-left:12px;padding-right:12px}

/* prose */
.prose h4{font-family:'Outfit';font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);margin:22px 0 8px}
.prose p{margin:0 0 12px;font-size:14px;line-height:1.72;color:var(--ink-2)}
.prose p b{color:var(--ink);font-weight:600}
.pull{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--gold);
  border-radius:0 14px 14px 0;padding:14px 16px;margin:16px 0}
.pull .ar{font-family:'Amiri';font-size:20px;direction:rtl;text-align:right;line-height:1.9}
.pull .rf{font-family:'Outfit';font-size:11.5px;font-weight:600;color:var(--accent);margin-top:8px}

/* list items */
.li{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%}
.li + .li{border-top:1px solid var(--line-2)}
.li .n{font-family:'Outfit';font-size:14px;font-weight:600;letter-spacing:-.01em}
.li .d{font-size:12px;color:var(--ink-3);margin-top:3px;line-height:1.5}
.li .r{font-family:'Outfit';font-size:11.5px;font-weight:600;color:var(--ink-3);
  background:var(--surface-2);padding:4px 9px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.li .arn{font-family:'Amiri';font-size:18px;direction:rtl;color:var(--ink-2)}

/* chips / segments */
.chips{display:flex;gap:7px;padding:0 16px 12px;overflow-x:auto}
.chips::-webkit-scrollbar{height:0}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-family:'Outfit';font-size:12.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.chip.on{background:var(--teal-700);border-color:var(--teal-700);color:#fff;font-weight:600}
.seg{display:grid;grid-auto-flow:column;gap:4px;background:var(--surface-2);padding:4px;border-radius:14px;margin:0 16px 12px}
.seg button{padding:10px 6px;border-radius:11px;font-family:'Outfit';font-size:12.5px;font-weight:500;
  color:var(--ink-2);text-align:center}
.seg button.on{background:var(--surface);box-shadow:var(--shadow);color:var(--ink);font-weight:600}

/* tree */
.tree{padding:0 2px}
.tnode{width:100%;display:flex;align-items:center;gap:10px;padding:12px 12px;border-radius:14px;
  background:var(--surface);border:1px solid var(--line);margin-bottom:6px}
.tkids{margin:0 0 6px 16px;padding-left:12px;border-left:1px solid var(--line)}
.tnode .cv{color:var(--ink-3);transition:transform .18s}
.tnode.open .cv{transform:rotate(90deg)}
.tnode .n{font-family:'Outfit';font-size:14px;font-weight:600;flex:1}
.tnode .c{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;padding:0 4px 12px;font-size:11.5px;color:var(--ink-3)}
.crumbs b{font-family:'Outfit';font-weight:600;color:var(--ink-2)}

/* khatam */
.kbar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:10px}
.kbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal-600),var(--teal-400))}

/* sheets */
.scrim{position:absolute;inset:0;background:rgba(4,20,19,.45);opacity:0;pointer-events:none;
  transition:opacity .22s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;background:var(--surface);
  border-radius:26px 26px 0 0;padding:10px 18px 20px;transform:translateY(103%);
  transition:transform .26s cubic-bezier(.32,.72,0,1);box-shadow:0 -12px 40px -20px rgba(0,0,0,.5);
  max-height:88%;overflow-y:auto}
.sheet.open{transform:translateY(0)}
.sheet::-webkit-scrollbar{width:0}
.grab{width:36px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 14px}
.sh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:15px}
.sh-nm{font-family:'Outfit';font-size:19px;font-weight:600;letter-spacing:-.015em}
.sh-mn{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.sh-ar{font-family:'Amiri';font-size:29px;direction:rtl;line-height:1.2}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:15px}
.fact{background:var(--surface-2);border-radius:13px;padding:11px 13px}
.fact .l{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.fact .v{font-family:'Outfit';font-size:14.5px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:10px}
.btn{flex:1;padding:14px;border-radius:15px;font-family:'Outfit';font-size:14.5px;font-weight:600;text-align:center}
.btn.p{background:var(--teal-700);color:#fff}
.btn.g{background:var(--surface-2);color:var(--ink-2)}
.menu-item{display:flex;align-items:center;gap:13px;padding:13px 4px;width:100%}
.menu-item + .menu-item{border-top:1px solid var(--line-2)}
.menu-item .n{font-family:'Outfit';font-size:14.5px;font-weight:500;flex:1}
.goinput{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:14px;
  padding:12px 15px;margin-bottom:12px}
.goinput input{flex:1;border:none;outline:none;background:none;font-size:15px;color:var(--ink)}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.quick button{padding:8px 12px;border-radius:11px;background:var(--surface-2);font-family:'Outfit';
  font-size:12.5px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* screen index */
.index-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.index-grid button{padding:12px 13px;border-radius:13px;background:var(--surface-2)}
.index-grid .n{font-family:'Outfit';font-size:13px;font-weight:600}
.index-grid .r{font-size:10.5px;color:var(--ink-3);margin-top:2px;font-family:ui-monospace,monospace}
.ixh{font-family:'Outfit';font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);margin:16px 0 8px}
/* render fix: prototype uses <span> where block layout is intended */
.cont .eye,.cont .nm,.cont .ar,.cont .mt,.cont .bar{display:block}
.qtxt .t,.qtxt .s,.surah-nm,.anchor .t,.anchor .s,
.sv .k,.sv .r,.sv .e,.li .n,.li .d,.ayah .num,.ayah .ar,.ayah .tr{display:block}
.li>span[style*="flex:1"]{min-width:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div class="harness">
  <div class="hbar">
    <button class="hbtn" id="tTheme">Dark</button>
    <button class="hbtn" id="tIndex">All screens</button>
    <button class="hbtn" id="tHome">Reset</button>
    <span class="crumb" id="crumb">Quran home</span>
  </div>

  <div class="phone">
    <div id="stage"></div>
    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet"></div>
  </div>

  <p class="note">Every destination in the redesigned Quran section, wired up. Back arrows pop the stack; “All screens” jumps straight to any of them. Surah data is a 36-surah subset; commentary and background prose are placeholder copy.</p>
</div>

<script>

 [26,"Ash-Shu'ara","الشعراء","The Poets",227,"Meccan",367,19],
 [27,"An-Naml","النمل","The Ant",93,"Meccan",377,19],
 [28,"Al-Qasas","القصص","The Stories",88,"Meccan",385,20],
 [29,"Al-Ankabut","العنكبوت","The Spider",69,"Meccan",396,20],
 [30,"Ar-Rum","الروم","The Romans",60,"Meccan",404,21],

/* ────────── router ────────── */
let stack=[];
function bar(title,sub,actions){
  return '<div class="appbar">'+
    (stack.length ? '<button class="ico" data-act="back" aria-label="Back">'+I.back+'</button>' : '<span style="width:6px"></span>')+
    '<h1>'+title+(sub?'<span class="sub">'+sub+'</span>':'')+'</h1>'+(actions||'')+'</div>';
}
function push(name,params){
  const prev = stage.lastElementChild;
  const el = document.createElement("div");
  el.className="screen enter";
  el.dataset.name=name;
  el._params=params||{};
  stage.appendChild(el);
  paint(el);
  requestAnimationFrame(()=>{ el.classList.remove("enter"); if(prev) prev.classList.add("under"); });
  stack.push({name,params:params||{}});
  crumb();
}
function replaceRoot(name,params){
  stage.innerHTML=""; stack=[];
  const el=document.createElement("div"); el.className="screen"; el.dataset.name=name; el._params=params||{};
  stage.appendChild(el); paint(el); stack.push({name,params:params||{}}); crumb();
}
function pop(){
  if(stage.children.length<2) return;
  const top=stage.lastElementChild, under=top.previousElementSibling;
  top.classList.add("enter"); if(under) under.classList.remove("under");
  setTimeout(()=>top.remove(),260);
  stack.pop(); crumb();
}
function crumb(){ $("crumb").textContent = stack.map(s=>SCREENS[s.name].label).join(" › "); }
function paint(el){
  const def=SCREENS[el.dataset.name];
  el.innerHTML=def.html(el._params);
  el.addEventListener("click",ev=>{
    const t=ev.target.closest("[data-act]"); if(!t) return;
    const act=t.dataset.act;
    if(act==="back") return pop();
    if(act==="go") return push(t.dataset.to, JSON.parse(t.dataset.p||"{}"));
    if(def.on) def.on(act,t,el);
  });
  if(def.after) def.after(el,el._params);
}

background:{label:"Background",html:p=>{const s=surah(p.n);return (

 '<div class="body prose">'+
 '<h4>When it was revealed</h4><p>Revealed in <b>'+s.place+' period</b>, in the years when the early community was under sustained pressure. The surah answers questions put to the Prophet by those testing whether his message matched what earlier scriptures held.</p>'+

 '<div class="rf">'+s.en+' 18:28</div></div>'+

themes:{label:"Themes",html:()=>
 bar("Themes","Three ways the subjects are arranged")+
 '<div class="seg" id="seg"></div>'+
 '<div class="body"><div class="tree" id="tree"></div>'+
 '<div class="empty" id="segnote"></div></div>',
 after(el){
   const TREES=[["Outline","The curated thematic outline — 695 subjects"],
                ["By kind","Places, creatures, events — 284 subjects"],
                ["Index","The shape a printed concordance has"]];
   let t=0, open={};
   const draw=()=>{
     el.querySelector("#seg").innerHTML=TREES.map((x,i)=>'<button class="'+(i===t?"on":"")+'" data-act="seg" data-i="'+i+'">'+x[0]+'</button>').join("");
     el.querySelector("#segnote").textContent=TREES[t][1];
     const node=(n,depth)=>{
       const has=n.kids&&n.kids.length, isOpen=open[n.id];
       return '<div>'+
         '<div class="tnode'+(isOpen?" open":"")+'">'+
           (has?'<button data-act="t" data-id="'+n.id+'" style="display:flex;align-items:center;gap:10px;flex:1">'+I.chevs+
                '<span class="n">'+n.n+'</span></button>'
               :'<span style="width:16px"></span><span class="n">'+n.n+'</span>')+
           '<span class="c">'+n.c+'</span>'+
           '<button class="surah-i" data-act="go" data-to="topic" data-p=\''+JSON.stringify({n:n.n,ar:n.ar,c:n.c})+'\'>'+I.chev+'</button>'+
         '</div>'+
         (has&&isOpen?'<div class="tkids">'+n.kids.map(k=>node(k,depth+1)).join("")+'</div>':'')+
       '</div>';
     };
     el.querySelector("#tree").innerHTML=TOPICS.map(n=>node(n,0)).join("");
     el.querySelectorAll("[data-act=seg]").forEach(b=>b.addEventListener("click",()=>{t=+b.dataset.i;draw();}));
     el.querySelectorAll("[data-act=t]").forEach(b=>b.addEventListener("click",()=>{
       const id=+b.dataset.id; open[id]=!open[id]; draw();
     }));
   };
   draw();
 }},

/* ────────── sheets ────────── */
function openSheet(html){ sheet.innerHTML='<div class="grab"></div>'+html; sheet.classList.add("open"); scrim.classList.add("open"); }
function closeSheet(){ sheet.classList.remove("open"); scrim.classList.remove("open"); }
scrim.addEventListener("click",closeSheet);
sheet.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-act]"); if(!t) return;
  const a=t.dataset.act;
  if(a==="close") return closeSheet();
  if(a==="sgo"){ closeSheet(); push(t.dataset.to, JSON.parse(t.dataset.p||"{}")); }
});
const sgo=(to,p,cls,inner)=>'<button class="'+cls+'" data-act="sgo" data-to="'+to+'" data-p=\''+JSON.stringify(p||{})+'\'>'+inner+'</button>';

function openInfo(s){
  openSheet(
   '<div class="sh-top"><div><div class="sh-nm">'+s.en+'</div>'+
   '<div class="sh-mn">'+s.mean+' · surah '+s.n+' of 114</div></div>'+
   '<div class="sh-ar">'+s.ar+'</div></div>'+
   '<div class="facts">'+
    fact("Revealed in",s.place)+fact("Ayahs",s.ayahs)+fact("Juz",s.juz)+fact("Starts on page",s.page)+
   '</div>'+
   '<div class="acts" style="margin-bottom:10px">'+
     sgo("background",{n:s.n},"btn g","Full background")+
     sgo("reader",{surah:s.n},"btn p","Read surah")+
   '</div>'+
   '<div class="acts">'+
     sgo("passages",{n:s.n},"btn g","Passages")+
     sgo("subjects",{n:s.n},"btn g","Subjects")+
   '</div>');
}
const fact=(l,v)=>'<div class="fact"><div class="l">'+l+'</div><div class="v">'+v+'</div></div>';

function openAyah(sn,an){
  const s=surah(sn);
  openSheet('<div class="sh-nm" style="margin-bottom:2px">'+s.en+' '+sn+':'+an+'</div>'+
   '<div class="sh-mn" style="margin-bottom:12px">Juz '+s.juz+' · page '+s.page+'</div>'+
   '<button class="menu-item" data-act="close">'+I.mark+'<span class="n">Bookmark this ayah</span></button>'+
   '<button class="menu-item" data-act="close">'+I.heart+'<span class="n">Add to favourites</span></button>'+
   '<button class="menu-item" data-act="close">'+I.note+'<span class="n">Write a note</span></button>'+
   sgo("tafseer",{surah:sn,ayah:an},"menu-item",I.text+'<span class="n">Tafseer</span>')+
   sgo("passages",{n:sn},"menu-item",I.layers+'<span class="n">Passages in this surah</span>')+
   sgo("subjects",{n:sn},"menu-item",I.grid.replace('width="19" height="19"','width="18" height="18"')+'<span class="n">Subjects in this ayah</span>')+
   '<button class="menu-item" data-act="close">'+I.share+'<span class="n">Share</span></button>');
}

function openGoTo(){
  openSheet('<div class="sh-nm" style="margin-bottom:2px">Go to</div>'+
   '<div class="sh-mn" style="margin-bottom:14px">Same reader, different anchor — no need to go back</div>'+
   '<div class="seg" id="gseg" style="margin:0 0 14px"><button class="on" data-g="0">Surah</button>'+
   '<button data-g="1">Juz</button><button data-g="2">Page</button></div>'+
   '<div id="gbody"></div>');
  let mode=0;
  const draw=()=>{
    sheet.querySelectorAll("#gseg button").forEach(b=>b.classList.toggle("on",+b.dataset.g===mode));
    const body=sheet.querySelector("#gbody");
    if(mode===0){
      body.innerHTML='<div class="quick">'+S.slice(0,12).map(s=>
        '<button data-act="sgo" data-to="reader" data-p=\''+JSON.stringify({surah:s.n})+'\'>'+s.n+' '+s.en+'</button>').join("")+'</div>'+
        '<div class="empty" style="padding:8px 0">…and the rest, via Browse.</div>';
    } else if(mode===1){
      body.innerHTML='<div class="quick">'+Array.from({length:30},(_,i)=>i+1).map(n=>
        '<button data-act="sgo" data-to="reader" data-p=\''+JSON.stringify({juz:n})+'\'>'+n+'</button>').join("")+'</div>';
    } else {
      body.innerHTML='<div class="goinput"><input id="pg" inputmode="numeric" placeholder="1 – 604"></div>'+
        '<div class="quick">'+[1,50,151,293,404,562,604].map(n=>
        '<button data-act="sgo" data-to="reader" data-p=\''+JSON.stringify({page:n})+'\'>p '+n+'</button>').join("")+'</div>';
    }
  };
  sheet.querySelectorAll("#gseg button").forEach(b=>b.addEventListener("click",()=>{mode=+b.dataset.g;draw();}));
  draw();
}

function openIndex(){
  const groups=[
    ["Screens",[["home","Quran home","Route.Quran"],["browse","Browse","QuranBrowse · new"],
      ["saved","Saved","QuranSaved · merged"],["reader","Reader","QuranReader/Page/Juz"],
      ["background","Surah background","SurahBackground"],["passages","Passages","SurahPassages"],
      ["subjects","Subjects","SurahSubjects"],["themes","Themes","QuranTopics"],
      ["topic","Topic detail","QuranTopicDetail"],["tafseer","Tafseer","Tafseer"],
      ["khatam","Khatam list","KhatamList"],["khatamDetail","Khatam detail","KhatamDetail"],
      ["search","Search","QuranSearch"]]]
  ];
  openSheet(groups.map(g=>'<div class="ixh">'+g[0]+'</div><div class="index-grid">'+
    g[1].map(x=>'<button data-act="sgo" data-to="'+x[0]+'" data-p=\''+JSON.stringify(x[0]==="reader"?{surah:18}:x[0]==="topic"?{n:"Patience",ar:"الصبر",c:312}:{n:18,id:1})+'\'>'+
      '<span class="n">'+x[1]+'</span><span class="r">'+x[2]+'</span></button>').join("")+'</div>').join("")+
    '<div class="ixh">Sheets</div><div class="index-grid">'+
    '<button data-act="ix" data-k="info"><span class="n">Surah info</span><span class="r">bottom sheet</span></button>'+
    '<button data-act="ix" data-k="ayah"><span class="n">Ayah menu</span><span class="r">bottom sheet</span></button>'+
    '<button data-act="ix" data-k="goto"><span class="n">Go to…</span><span class="r">bottom sheet</span></button>'+
    '</div>');
  sheet.querySelectorAll("[data-act=ix]").forEach(b=>b.addEventListener("click",()=>{
    const k=b.dataset.k; closeSheet();
    setTimeout(()=>{ if(k==="info") openInfo(surah(18)); if(k==="ayah") openAyah(18,1); if(k==="goto") openGoTo(); },240);
  }));
}

/* ────────── chrome ────────── */
$("tIndex").addEventListener("click",openIndex);
$("tHome").addEventListener("click",()=>replaceRoot("home",{}));
$("tTheme").addEventListener("click",function(){
  const d=document.documentElement.getAttribute("data-theme")==="dark";
  document.documentElement.setAttribute("data-theme",d?"light":"dark");
  this.textContent=d?"Dark":"Light";
});

replaceRoot("home",{});
})();
