<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nimaz · Qaida journey review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9eeec;color:#18332e;font:15px/1.5 system-ui,sans-serif}.toolbar{padding:20px;max-width:1000px;margin:auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px}.toolbar strong{margin-right:auto}select,.theme{font:inherit;padding:10px 12px;border:1px solid #ccd8d3;border-radius:14px;background:#fff;color:#17352d;max-width:100%}.note{max-width:700px;margin:0 auto 18px;padding:0 20px;font-size:13px;color:#50645d}.phone{--bg:#f8f9f8;--fg:#172520;--muted:#58665e;--surface:#fff;--soft:#edf2ef;--accent:#007e72;--mint:#ccf7ee;--gold:#fff0bd;--purple:#eee0ff;--line:#dce4df;max-width:411px;margin:0 auto 28px;background:var(--bg);color:var(--fg);border-radius:28px;box-shadow:0 18px 70px #17352d22;overflow:hidden;min-height:720px;display:flex;flex-direction:column}.phone.dark{--bg:#111b18;--fg:#e3eee8;--muted:#afc2b8;--surface:#1c2b25;--soft:#24372d;--accent:#71ddcb;--mint:#174b43;--gold:#51451e;--purple:#392a50;--line:#35473d}.top{display:flex;align-items:center;gap:10px;padding:14px 16px}.pill{background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:11px 15px;display:flex;align-items:center;gap:10px;color:inherit;font:inherit}.top .tools{margin-left:auto}.screen{padding:0 20px 24px;flex:1}.screen h1,.screen h2,.screen h3{font-family:Georgia,serif;line-height:1.2}.screen h1{font-size:28px;margin:14px 0}.screen h2{font-size:22px}.screen h3{font-size:18px}.screen p{color:var(--muted);margin:10px 0 18px}.art{width:100%;height:175px;object-fit:contain;display:block;margin:6px auto 10px}.art.small{height:105px}.card{background:var(--surface);border:0;border-radius:22px;padding:18px;margin:12px 0}.chapter{display:flex;gap:16px;align-items:center;width:100%;text-align:start;color:var(--fg);font:inherit;cursor:pointer}.chapter:nth-of-type(3n+1){background:var(--mint)}.chapter:nth-of-type(3n+2){background:var(--gold)}.chapter:nth-of-type(3n){background:var(--purple)}.chapter strong{display:block;font-family:Georgia,serif;font-size:18px}.chapter small{display:block;margin-top:5px}.chapter svg{flex:none}.button{display:block;width:100%;border:0;border-radius:28px;padding:14px 18px;margin-top:12px;background:var(--accent);color:var(--bg);font:600 14px/1.4 system-ui;cursor:pointer;min-height:48px}.button.secondary{background:var(--soft);color:var(--fg)}.button:disabled{opacity:.5}.bar{background:var(--mint);border-radius:8px;height:6px;margin:14px 0 8px;overflow:hidden}.bar span{display:block;height:100%;width:25%;background:var(--accent)}.meta,.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.meta{font-size:12px;color:var(--muted)}.nav{display:flex;gap:5px;margin:8px 12px 14px;padding:6px;background:var(--soft);border-radius:28px;box-shadow:0 4px 14px #0000000a}.nav button{flex:1;min-width:0;border:0;background:transparent;border-radius:23px;color:var(--muted);padding:12px 4px;min-height:66px;font:12px system-ui;cursor:pointer}.nav button svg{display:block;margin:0 auto 5px}.nav button.active{background:var(--mint);color:var(--fg)}svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.banner{background:var(--mint);border-radius:17px;padding:16px;margin:14px 0;display:flex;gap:12px;font-size:14px}.banner svg{flex:none}.banner.error{background:#fae5e0;color:#782a20}.dark .banner.error{background:#522c26;color:#ffdad2}.arabic{font:74px/1.7 Georgia,serif;text-align:center;margin:20px 0;color:var(--fg)}.letters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;direction:rtl}.letters button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:18px;min-height:76px;font:32px Georgia;cursor:pointer}.path{display:flex;gap:10px;justify-content:space-around}.path button{border:0;background:var(--soft);color:var(--fg);border-radius:50%;width:49px;height:49px;font:18px system-ui}.path .current{background:var(--accent);color:var(--bg);outline:3px solid #dbab32}.row button{width:auto;flex:1}.setting{padding:15px 0;border-bottom:1px solid var(--line)}.setting:last-child{border:0}.setting small{display:block;color:var(--muted);margin-top:7px}.setting input{width:24px;height:24px;accent-color:var(--accent)}.mode{display:flex;gap:5px;background:var(--soft);border-radius:20px;padding:5px}.mode button{flex:1;border:0;padding:12px 5px;border-radius:16px;background:transparent;color:var(--fg);font:13px system-ui}.mode .active{background:var(--mint)}button:focus-visible,select:focus-visible{outline:3px solid #c38f25;outline-offset:3px}@media(max-width:440px){.phone{border-radius:0;margin-bottom:0}.toolbar{padding:12px}.note{font-size:12px}}@media(prefers-reduced-motion:no-preference){.screen{animation:appear .18s ease-out}@keyframes appear{from{opacity:.4;transform:translateY(3px)}}}
</style></head><body>
<div class="toolbar"><strong>Nimaz · Qaida review</strong><select id="flow" aria-label="Preview flow"></select><select id="locale" aria-label="Language"><option value="en">English</option><option value="tr">Türkçe</option><option value="id">Bahasa Indonesia</option><option value="ms">Bahasa Melayu</option><option value="fr">Français</option><option value="de">Deutsch</option></select><button class="theme" id="theme">Dark mode</button></div>
<p class="note">Interactive design review using the committed artwork and translations. Sample progress; audio is simulated. This is a browser reconstruction, not an Android capture. Native previews are awaiting a successful Android build.</p>
<div class="phone" id="phone"><header class="top" id="top"></header><main class="screen" id="screen"></main><nav class="nav" id="nav" aria-label="Qaida"></nav></div>
<script>
const DATA=__DATA__, ART=__ART__;
const flows=['journey','chapters','review','review-empty','audio','audio-empty','intro','focus','repeat','practise','self-check','all-cards','due-review','reward','letters','letter-detail','settings','clear-audio','reset','loading','lesson-empty','downloading','audio-unavailable','audio-error','playback-error'];
const root=document.getElementById('phone'),screen=document.getElementById('screen'),flow=document.getElementById('flow'),locale=document.getElementById('locale');let state='journey',letter='ب',position=0,playing=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const t=(k,...args)=>{let s=DATA[locale.value]['qaida_'+k]||DATA.en['qaida_'+k]||k;args.forEach((a,i)=>s=s.replace(new RegExp('%'+(i+1)+'\\$[ds]','g'),a));return esc(s.replace(/\\'/g,"'"));};
const shapes={back:'M19 12H5m7-7-7 7 7 7',book:'M12 5v15M3 4c4-1 6 0 9 2 3-2 5-3 9-2v15c-4-1-6 0-9 2-3-2-5-3-9-2Z',route:'M5 4v8a4 4 0 0 0 4 4h6a4 4 0 0 0 0-8h-2m-8-4 3 3m-3-3-3 3m11-2 3 3-3 3',audio:'M4 13v-2a8 8 0 0 1 16 0v2M4 12H2v8h4v-8Zm16 0h2v8h-4v-8Z',settings:'M4 6h16M4 12h16M4 18h16M8 4v4m8 2v4m-5 2v4',letters:'M4 4h12m-6 0v3c0 5-3 8-6 10m1-9c2 4 5 6 9 8m0 4 4-12 4 12m-6-4h4',arrow:'m9 5 7 7-7 7',check:'m5 12 4 4L19 6',info:'M12 11v6m0-10v.1M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',play:'m8 5 11 7-11 7Z',lock:'M7 10V7a5 5 0 0 1 10 0v3M5 10h14v11H5Z'};
const icon=n=>`<svg aria-hidden="true" viewBox="0 0 24 24"><path d="${shapes[n]||shapes.book}"/></svg>`;
const image=(name,small=false)=>`<img class="art ${small?'small':''}" src="${ART[name]}" alt="">`;
const button=(key,dest,secondary=false)=>`<button class="button ${secondary?'secondary':''}" data-go="${dest}">${t(key)}</button>`;
const banner=(key,error=false,...args)=>`<div class="banner ${error?'error':''}">${icon(error?'info':'check')}<span>${t(key,...args)}</span></div>`;
const card=(text)=>`<div class="card">${text}</div>`;
function go(s){state=s;flow.value=s;playing=false;render();}
function render(){document.documentElement.lang=locale.value;document.getElementById('top').innerHTML=`<button class="pill" aria-label="${t('back_journey')}" data-go="journey">${icon('back')}</button><span class="pill"><b>Qaida</b></span><div class="pill tools"><button class="pill" data-go="letters" aria-label="${t('chapter_letters')}">${icon('letters')}</button><button class="pill" data-go="settings" aria-label="${t('settings')}">${icon('settings')}</button></div>`;
let h='';const nav=document.getElementById('nav');const home=['journey','chapters','review','review-empty','audio','audio-empty'].includes(state);nav.style.display=home?'flex':'none';nav.innerHTML=['journey','review','audio'].map((n,i)=>`<button data-go="${n}" class="${state.startsWith(n)||state==='chapters'&&i===0?'active':''}" aria-current="${state.startsWith(n)?'page':'false'}">${icon(['route','book','audio'][i])}${t(['tab_journey','tab_review','tab_downloads'][i])}</button>`).join('');
if(state==='journey'||state==='chapters'){h=`<h1>${t('tab_journey')}</h1><p>${t('gentle_intro')}</p>${image('journey_book')}${card(`<h3>${t('daily_title')}</h3><div class="bar"><span></span></div><div class="meta"><span>${t('chapter_range',4,17)}</span><span>18%</span></div>`)}<h2>${t('chapters_title')}</h2>`;['letters','build','confidence'].forEach((k,i)=>{h+=`<button class="card chapter" data-go="${state==='chapters'?'intro':'chapters'}">${icon(['book','letters','route'][i])}<span><strong>${t('chapter_'+k)}</strong><small>${t('chapter_'+k+'_hint')}</small></span>${icon('arrow')}</button>`;if(state==='chapters'&&i===0)for(let n=1;n<=5;n++)h+=button('chapter_range','intro',true).replace(t('chapter_range'),t('chapter_range',n,n));});h+=`<h3>${t('path_title')}</h3><div class="path"><button data-go="intro">3</button><button class="current" data-go="intro">4</button><button disabled>${icon('lock')}</button><button disabled>${icon('lock')}</button></div>${button('continue_practice','intro')}<p>${t('today_count',3)}</p>`;}
else if(state.startsWith('review')){h=`${image(state==='review-empty'?'empty_art':'review_art')}<h1>${t('review_title')}</h1><p>${t('review_description')}</p>`+(state==='review-empty'?banner('review_empty')+button('continue_practice','intro'):button('chapter_letters','due-review',true)+button('chapter_build','due-review',true));}
else if(state==='audio'||state==='audio-empty'){h=card(`${image('audio_art')}<h1>${t('downloads_title')}</h1><p>${t('downloads_description')}</p><p>${t('cache_size',state==='audio'?8:0)}</p>${state==='audio'?button('clear_audio','clear-audio',true):banner('downloads_empty')}`);}
else if(state==='intro'||state==='lesson-empty'){h=`${image(state==='lesson-empty'?'empty_art':'journey_book')}<h1>${t('lesson_intro')}</h1><div class="arabic" style="font-size:36px">الحَرَكَات</div><p>${t('teacher_hint')}</p>${state==='lesson-empty'?banner('empty_lesson'):button('begin_lesson','focus')}${image('audio_art',true)}${banner('audio_ready')}`;}
else if(['focus','repeat','practise','self-check','due-review','all-cards'].includes(state)){h=`<h2>${t('cell_position',position+1,3)}</h2><div class="bar"><span style="width:${(position+1)*33.3}%"></span></div><div class="mode">${['focus','repeat','practise','all-cards'].map((s,i)=>`<button data-go="${s}" class="${state===s?'active':''}">${t(['listen','repeat_tab','practise','all_cells'][i])}</button>`).join('')}</div>`;if(state==='all-cards'){h+=['بَ','بِ','بُ'].map(g=>`<button class="button secondary" data-go="focus" style="font-size:40px">${g}</button>`).join('');}else{h+=card(`<div class="arabic">${['بَ','بِ','بُ'][position]}</div>${['practise','due-review'].includes(state)?`<p>${t('read_prompt')}</p>${button('reveal','self-check')}`:`<div style="text-align:center;font-size:23px">${['ba','bi','bu'][position]}</div>${state==='self-check'?button('confident','reward')+button('again','repeat',true):`<button class="button" id="play">${t(playing?'stop_sound':'play_sound')}</button><p>${t('slow_hint')}</p>`}`}`);h+=`<div class="row"><button class="button secondary" id="prev">${t('previous_sound')}</button><button class="button" id="next">${t('next_sound')}</button></div>`;}h+=button('finish_session','reward',true);}
else if(state==='reward'){h=`${image('reward_book')}<h1>${t('reward_title')}</h1><p>${t('reward_description')}</p>${card(banner('practised_done')+`<p>${t('session_count',3)}</p>`)}${button('back_journey','journey')}${button('practice_more','focus',true)}`;}
else if(state==='letters'){h=`${image('letters_art')}<h1>${t('chapter_letters')}</h1><div class="letters">${Array.from('ابتثجحخدذرزسشصضطظعغفقكلمنهويء').map(l=>`<button data-letter="${l}">${l}</button>`).join('')}</div>`;}
else if(state==='letter-detail'){h=`<div class="arabic">${letter}</div><h2>${t('anatomy_side')}</h2>${image('anatomy_side_art')}<p>${t('anatomy_key')}</p>${button('back_lessons','letters',true)}`;}
else if(state==='settings'){h=`${image('settings_art')}<h1>${t('settings')}</h1>${card(`<h3>${t('settings_learning')}</h3>${['transliteration','slow'].map(k=>`<label class="setting row"><span>${t('settings_'+k)}<small>${t('settings_'+k+'_hint')}</small></span><input type="checkbox" ${k==='transliteration'?'checked':''}></label>`).join('')}`)}${card(`<h3>${t('settings_storage')}</h3><p>${t('downloads_description')}</p>${button('clear_audio','clear-audio',true)}`)}${card(`<h3>${t('settings_progress')}</h3><p>${t('settings_reset_hint')}</p><button class="button secondary" data-go="reset">${t('settings_progress')}</button>`)}<p>${t('settings_local')}</p>`;}
else if(state==='clear-audio'||state==='reset'){h=card(`${image('settings_art',true)}<h2>${t(state==='reset'?'settings_progress':'clear_audio')}</h2><p>${t(state==='reset'?'settings_reset_hint':'clear_audio_message')}</p>${button(state==='reset'?'back_journey':'clear_audio',state==='reset'?'journey':'audio-empty')}${button('settings','settings',true)}`);}
else{let key={'loading':'getting_ready','downloading':'download_progress','audio-unavailable':'audio_unavailable','audio-error':'audio_failed','playback-error':'playback_failed'}[state];h=`${image(state==='loading'?'empty_art':'audio_art')}<h1>${t(state==='loading'?'getting_ready':'downloads_title')}</h1>${banner(key,state.includes('error'),1,3)}${state==='downloading'?'<div class="bar"><span style="width:33%"></span></div>':state!=='loading'?button('retry_audio','downloading'):''}${button('continue_practice','intro',true)}`;}
screen.innerHTML=h;
root.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));root.querySelectorAll('[data-letter]').forEach(b=>b.onclick=()=>{letter=b.dataset.letter;go('letter-detail')});const play=document.getElementById('play');if(play)play.onclick=()=>{playing=!playing;render()};const next=document.getElementById('next');if(next)next.onclick=()=>{if(position===2)go('reward');else{position++;render()}};const prev=document.getElementById('prev');if(prev){prev.disabled=position===0;prev.onclick=()=>{position--;render()}};
}
flows.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s.replaceAll('-',' ');flow.append(o)});flow.onchange=()=>go(flow.value);locale.onchange=render;document.getElementById('theme').onclick=()=>{root.classList.toggle('dark');document.getElementById('theme').textContent=root.classList.contains('dark')?'Light mode':'Dark mode'};go('journey');
</script></body></html>
