else if(state==='settings'){h=`${image('settings_art')}<h1>${t('settings')}</h1>${card(`<h3>${t('settings_learning')}</h3>${['transliteration','slow'].map(k=>`<label class="setting row"><span>${t('settings_'+k)}<small>${t('settings_'+k+'_hint')}</small></span><input type="checkbox" ${k==='transliteration'?'checked':''}></label>`).join('')}`)}${card(`<h3>${t('settings_storage')}</h3><p>${t('downloads_description')}</p>${button('clear_audio','clear-audio',true)}`)}${card(`<h3>${t('settings_progress')}</h3><p>${t('settings_reset_hint')}</p><button class="button secondary" data-go="reset">${t('settings_progress')}</button>`)}<p>${t('settings_local')}</p>`;}
else if(state==='clear-audio'||state==='reset'){h=card(`${image('settings_art',true)}<h2>${t(state==='reset'?'settings_progress':'clear_audio')}</h2><p>${t(state==='reset'?'settings_reset_hint':'clear_audio_message')}</p>${button(state==='reset'?'back_journey':'clear_audio',state==='reset'?'journey':'audio-empty')}${button('settings','settings',true)}`);}
else{let key={'loading':'getting_ready','downloading':'download_progress','audio-unavailable':'audio_unavailable','audio-error':'audio_failed','playback-error':'playback_failed'}[state];h=`${image(state==='loading'?'empty_art':'audio_art')}<h1>${t(state==='loading'?'getting_ready':'downloads_title')}</h1>${banner(key,state.includes('error'),1,3)}${state==='downloading'?'<div class="bar"><span style="width:33%"></span></div>':state!=='loading'?button('retry_audio','downloading'):''}${button('continue_practice','intro',true)}`;}
screen.innerHTML=h;
root.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));root.querySelectorAll('[data-letter]').forEach(b=>b.onclick=()=>{letter=b.dataset.letter;go('letter-detail')});const play=document.getElementById('play');if(play)play.onclick=()=>{playing=!playing;render()};const next=document.getElementById('next');if(next)next.onclick=()=>{if(position===2)go('reward');else{position++;render()}};const prev=document.getElementById('prev');if(prev){prev.disabled=position===0;prev.onclick=()=>{position--;render()}};
}
flows.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s.replaceAll('-',' ');flow.append(o)});flow.onchange=()=>go(flow.value);locale.onchange=render;document.getElementById('theme').onclick=()=>{root.classList.toggle('dark');document.getElementById('theme').textContent=root.classList.contains('dark')?'Light mode':'Dark mode'};go('journey');
</script></body></html>
