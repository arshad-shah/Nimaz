const shapes={back:'M19 12H5m7-7-7 7 7 7',book:'M12 5v15M3 4c4-1 6 0 9 2 3-2 5-3 9-2v15c-4-1-6 0-9 2-3-2-5-3-9-2Z',route:'M5 4v8a4 4 0 0 0 4 4h6a4 4 0 0 0 0-8h-2m-8-4 3 3m-3-3-3 3m11-2 3 3-3 3',audio:'M4 13v-2a8 8 0 0 1 16 0v2M4 12H2v8h4v-8Zm16 0h2v8h-4v-8Z',settings:'M4 6h16M4 12h16M4 18h16M8 4v4m8 2v4m-5 2v4',letters:'M4 4h12m-6 0v3c0 5-3 8-6 10m1-9c2 4 5 6 9 8m0 4 4-12 4 12m-6-4h4',arrow:'m9 5 7 7-7 7',check:'m5 12 4 4L19 6',info:'M12 11v6m0-10v.1M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',play:'m8 5 11 7-11 7Z',lock:'M7 10V7a5 5 0 0 1 10 0v3M5 10h14v11H5Z'};
const icon=n=>`<svg aria-hidden="true" viewBox="0 0 24 24"><path d="${shapes[n]||shapes.book}"/></svg>`;
const button=(key,dest,secondary=false)=>`<button class="button ${secondary?'secondary':''}" data-go="${dest}">${t(key)}</button>`;
const banner=(key,error=false,...args)=>`<div class="banner ${error?'error':''}">${icon(error?'info':'check')}<span>${t(key,...args)}</span></div>`;
const card=(text)=>`<div class="card">${text}</div>`;
function go(s){state=s;flow.value=s;playing=false;render();}
function render(){document.documentElement.lang=locale.value;document.getElementById('top').innerHTML=`<button class="pill" aria-label="${t('back_journey')}" data-go="journey">${icon('back')}</button><span class="pill"><b>Qaida</b></span><div class="pill tools"><button class="pill" data-go="letters" aria-label="${t('chapter_letters')}">${icon('letters')}</button><button class="pill" data-go="settings" aria-label="${t('settings')}">${icon('settings')}</button></div>`;
let h='';const nav=document.getElementById('nav');const home=['journey','chapters','review','review-empty','audio','audio-empty'].includes(state);nav.style.display=home?'flex':'none';nav.innerHTML=['journey','review','audio'].map((n,i)=>`<button data-go="${n}" class="${state.startsWith(n)||state==='chapters'&&i===0?'active':''}" aria-current="${state.startsWith(n)?'page':'false'}">${icon(['route','book','audio'][i])}${t(['tab_journey','tab_review','tab_downloads'][i])}</button>`).join('');
if(state==='journey'||state==='chapters'){h=`<h1>${t('tab_journey')}</h1><p>${t('gentle_intro')}</p>${card(`<h3>${t('daily_title')}</h3><div class="bar"><span></span></div><div class="meta"><span>${t('chapter_range',4,17)}</span><span>18%</span></div>`)}<h2>${t('chapters_title')}</h2>`;['letters','build','confidence'].forEach((k,i)=>{h+=`<button class="card chapter" data-go="${state==='chapters'?'intro':'chapters'}">${icon(['book','letters','route'][i])}<span><strong>${t('chapter_'+k)}</strong><small>${t('chapter_'+k+'_hint')}</small></span>${icon('arrow')}</button>`;if(state==='chapters'&&i===0)for(let n=1;n<=5;n++)h+=button('chapter_range','intro',true).replace(t('chapter_range'),t('chapter_range',n,n));});h+=`<h3>${t('path_title')}</h3><div class="path"><button data-go="intro">3</button><button class="current" data-go="intro">4</button><button disabled>${icon('lock')}</button><button disabled>${icon('lock')}</button></div>${button('continue_practice','intro')}<p>${t('today_count',3)}</p>`;}
else if(state.startsWith('review')){h=`<h1>${t('review_title')}</h1><p>${t('review_description')}</p>`+(state==='review-empty'?banner('review_empty')+button('continue_practice','intro'):button('chapter_letters','due-review',true)+button('chapter_build','due-review',true));}
else if(state==='audio'||state==='audio-empty'){h=card(`<h1>${t('downloads_title')}</h1><p>${t('downloads_description')}</p><p>${t('cache_size',state==='audio'?8:0)}</p>${state==='audio'?button('clear_audio','clear-audio',true):banner('downloads_empty')}`);}
else if(state==='intro'||state==='lesson-empty'){h=`<h1>${t('lesson_intro')}</h1><div class="arabic" style="font-size:36px">الحَرَكَات</div><p>${t('teacher_hint')}</p>${state==='lesson-empty'?banner('empty_lesson'):button('begin_lesson','focus')}${banner('audio_ready')}`;}
else if(['focus','repeat','practise','self-check','due-review','all-cards'].includes(state)){h=`<h2>${t('cell_position',position+1,3)}</h2><div class="bar"><span style="width:${(position+1)*33.3}%"></span></div><div class="mode">${['focus','repeat','practise','all-cards'].map((s,i)=>`<button data-go="${s}" class="${state===s?'active':''}">${t(['listen','repeat_tab','practise','all_cells'][i])}</button>`).join('')}</div>`;if(state==='all-cards'){h+=['بَ','بِ','بُ'].map(g=>`<button class="button secondary" data-go="focus" style="font-size:40px">${g}</button>`).join('');}else{h+=card(`<div class="arabic">${['بَ','بِ','بُ'][position]}</div>${['practise','due-review'].includes(state)?`<p>${t('read_prompt')}</p>${button('reveal','self-check')}`:`<div style="text-align:center;font-size:23px">${['ba','bi','bu'][position]}</div>${state==='self-check'?button('confident','reward')+button('again','repeat',true):`<button class="button" id="play">${t(playing?'stop_sound':'play_sound')}</button><p>${t('slow_hint')}</p>`}`}`);h+=`<div class="row"><button class="button secondary" id="prev">${t('previous_sound')}</button><button class="button" id="next">${t('next_sound')}</button></div>`;}h+=button('finish_session','reward',true);}
else if(state==='reward'){h=`<h1>${t('reward_title')}</h1><p>${t('reward_description')}</p>${card(banner('practised_done')+`<p>${t('session_count',3)}</p>`)}${button('back_journey','journey')}${button('practice_more','focus',true)}`;}
else if(state==='letters'){h=`<h1>${t('chapter_letters')}</h1><div class="letters">${Array.from('ابتثجحخدذرزسشصضطظعغفقكلمنهويء').map(l=>`<button data-letter="${l}">${l}</button>`).join('')}</div>`;}
else if(state==='letter-detail'){h=`<div class="arabic">${letter}</div>${button('back_lessons','letters',true)}`;}
else if(state==='settings'){h=`<h1>${t('settings')}</h1>${card(`<h3>${t('settings_learning')}</h3>${['transliteration','slow'].map(k=>`<label class="setting row"><span>${t('settings_'+k)}<small>${t('settings_'+k+'_hint')}</small></span><input type="checkbox" ${k==='transliteration'?'checked':''}></label>`).join('')}`)}${card(`<h3>${t('settings_storage')}</h3><p>${t('downloads_description')}</p>${button('clear_audio','clear-audio',true)}`)}${card(`<h3>${t('settings_progress')}</h3><p>${t('settings_reset_hint')}</p><button class="button secondary" data-go="reset">${t('settings_progress')}</button>`)}<p>${t('settings_local')}</p>`;}
else if(state==='clear-audio'||state==='reset'){h=card(`<h2>${t(state==='reset'?'settings_progress':'clear_audio')}</h2><p>${t(state==='reset'?'settings_reset_hint':'clear_audio_message')}</p>${button(state==='reset'?'back_journey':'clear_audio',state==='reset'?'journey':'audio-empty')}${button('settings','settings',true)}`);}
else{let key={'loading':'getting_ready','downloading':'download_progress','audio-unavailable':'audio_unavailable','audio-error':'audio_failed','playback-error':'playback_failed'}[state];h=`<h1>${t(state==='loading'?'getting_ready':'downloads_title')}</h1>${banner(key,state.includes('error'),1,3)}${state==='downloading'?'<div class="bar"><span style="width:33%"></span></div>':state!=='loading'?button('retry_audio','downloading'):''}${button('continue_practice','intro',true)}`;}
screen.innerHTML=h;
root.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));root.querySelectorAll('[data-letter]').forEach(b=>b.onclick=()=>{letter=b.dataset.letter;go('letter-detail')});const play=document.getElementById('play');if(play)play.onclick=()=>{playing=!playing;render()};const next=document.getElementById('next');if(next)next.onclick=()=>{if(position===2)go('reward');else{position++;render()}};const prev=document.getElementById('prev');if(prev){prev.disabled=position===0;prev.onclick=()=>{position--;render()}};
}
flows.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s.replaceAll('-',' ');flow.append(o)});flow.onchange=()=>go(flow.value);locale.onchange=render;document.getElementById('theme').onclick=()=>{root.classList.toggle('dark');document.getElementById('theme').textContent=root.classList.contains('dark')?'Light mode':'Dark mode'};go('journey');
</script></body></html>
