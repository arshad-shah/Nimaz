# Robolectric 4.11.x ships instrumented SDKs up to API 34, while the app compiles against a
# newer compileSdk. Pin the test runtime to 34 so the Compose UI tests for Home's components
# have a supported, downloadable android-all jar.
sdk=34

# A plain Application rather than the app's @HiltAndroidApp NimazApp — which a feature module
# cannot see, and which would drag Hilt/WorkManager initialisation into tests that only render
# components.
#
# A properties file is a *resource of its source set* and does not travel with the tests that
# need it, which is how :core:database lost its pin in PR 7 of #551. The thirty-odd tests that
# arrived here from `app/src/testDebug` need their own copy.
application=android.app.Application
