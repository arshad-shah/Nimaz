# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# 4g, not 2g: 2048m was tight for a 965-file Kotlin module running KSP, and a
# daemon that GCs its way through a build is slower than one that does not.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# ── Build performance (#463, #503) ───────────────────────────────────────────
# parallel: executes independent projects' tasks concurrently. It earns its keep from the
# multi-module split (#551) onward; before that it was close to a no-op, since :app and
# :baselineprofile are one dependency chain.
# caching: reuses task outputs across builds and branches.
org.gradle.parallel=true
org.gradle.caching=true

# configuration-cache: skips the whole configuration phase when nothing that feeds it has
# changed. Measured on a single-module build (#463), a no-op :app:compileDebugKotlin went from
# 7.95s to 0.85s; configuration cost is paid per project, so the win grows with the module count.
# It was off until #503 because `:app:fetchNimazData` did its work in a `doLast` calling
# script-level helpers and Gradle cannot serialize script object references. It is a typed task
# class in build-logic now (FetchNimazDataTask), so it serializes.
#
# problems=fail, not the default `warn`: a regression that only degrades the cache is invisible
# in a green build, and stays invisible until someone wonders why builds got slower. Fail loudly
# instead. See docs/specs/multi-module-migration/BASELINE.md for the before/after numbers.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true

# ── Nimaz AI (Ask with Proof) ────────────────────────────────────────────────
# Base URL of the deployed nimaz-ai Cloudflare Worker (custom domain configured
# in worker/wrangler.jsonc). The debug value is used by debug builds, the release
# value by release builds. Override per-environment via ~/.gradle/gradle.properties
# or -P flags on CI if you need a different host for local testing.
nimazAiWorkerUrlDebug=https://ai.arshadshah.com
nimazAiWorkerUrl=https://ai.arshadshah.com

# Google Cloud project number backing the Play Integrity standard request.
# Placeholder 0 until you create/link the Cloud project in the Play Console.
# With 0, debug builds fall back to the "debug-skip" attestation token.
playIntegrityCloudProjectNumber=403350204172
# Lets the IDE resolve the models for several projects at once during Gradle sync (Gradle 9.4+).
# Sync-time only — it has no effect on a command-line build, and it matters more with every
# module the multi-module split adds.
org.gradle.tooling.parallel=true
