# Robolectric 4.11.x ships instrumented SDKs up to API 34, while the app compiles against a
# newer compileSdk. Pin the test runtime to 34 so the shadow AlarmManager and shadow
# NotificationManager these tests read back have a supported, downloadable android-all jar.
#
# A properties file is a *resource of its source set* and does not travel with the tests that
# need it, which is how :core:database lost its pin in PR 7 of #551.
sdk=34

# `NotificationEntryPointApplication` is what the receiver tests name in their own `@Config`, so
# this only has to be something ordinary for anything that does not.
application=android.app.Application
