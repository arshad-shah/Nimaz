# Robolectric 4.11.x ships instrumented SDKs up to API 34, while the app compiles against a
# newer compileSdk. Pin the test runtime to 34 so `ShareCardRendererTest`'s NATIVE-graphics
# canvas has a supported, downloadable android-all jar.
sdk=34

# A plain Application: nothing here is injected, and the app's @HiltAndroidApp NimazApp is not
# visible from a `:core:*` module anyway.
#
# This file is a *resource of its source set* and does not travel with the tests that need it —
# which is how :core:database lost its pin in PR 7 of #551. The six share tests moved out of
# `core/ui/src/testDebug`, so they need their own copy here.
application=android.app.Application
