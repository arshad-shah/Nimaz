# Robolectric ships instrumented SDKs up to API 34; this module compiles against compileSdk 37,
# and Robolectric refuses to run when the manifest's target exceeds the newest SDK it has
# ("Package targetSdkVersion=37 > maxSdkVersion=36"). Pin the test runtime to a version it can
# actually download.
#
# `:app` carries the same pin at `src/testDebug/resources/robolectric.properties`. It did not
# come with the tests that moved here — a Robolectric config is a resource of the source set, not
# of the test file — and its absence surfaced as five `initializationError`s rather than as
# anything that named the cause.
sdk=34
