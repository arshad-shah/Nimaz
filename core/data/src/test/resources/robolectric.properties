# Robolectric ships instrumented SDKs up to API 34 while this module compiles against 37, and it
# refuses to run when the manifest target exceeds the newest SDK it has. A Robolectric config is a
# resource of the source set, not of the test file, so it does not travel with tests that move —
# in #580 its absence surfaced as five `initializationError`s naming only the SDK mismatch.
sdk=34
