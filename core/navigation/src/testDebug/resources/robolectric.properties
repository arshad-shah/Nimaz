# Robolectric 4.11.x ships instrumented SDKs up to API 34, while this module compiles against a
# newer compileSdk. Pin the test runtime to 34 so the one Compose test here has a supported,
# downloadable android-all jar.
sdk=34

# A plain Application, not the app's @HiltAndroidApp NimazApp — which this module cannot see and
# which would drag Hilt/WorkManager initialisation into a test that composes one empty NavHost.
application=android.app.Application
