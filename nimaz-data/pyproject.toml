[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nimaz-data"
version = "0.1.0"
description = "Nimaz Data Console — compile the Nimaz corpus from text sources into a verified SQLite artifact"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
tui = ["textual>=0.79"]
agent = ["mcp>=1.2"]
dev = ["pytest>=8.0"]

[project.scripts]
nz = "nimaz_data.cli.main:main"

[tool.setuptools.packages.find]
include = ["nimaz_data*"]

[tool.setuptools.package-data]
nimaz_data = ["ui/*.tcss", "ui/**/*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
