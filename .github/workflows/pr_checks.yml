name: Android PR Checks

on:
  pull_request:
    branches: [ master, dev ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The content artifact lives in a private repository. Mint a short-lived
      # installation token for it rather than carrying a long-lived PAT: the token
      # is scoped to nimaz-data, read-only, and expires in an hour. Same pattern as
      # the version-bump App above. See gradle/nimaz-data.gradle.kts.
      - name: Token for the content repository
        id: nimaz-data-token
        # Absent secrets must not fail the job here — let the build fail at
        # fetchNimazData instead, which prints the three ways to supply a credential.
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.NIMAZ_DATA_APP_ID }}
          private-key: ${{ secrets.NIMAZ_DATA_APP_PRIVATE_KEY }}
          owner: arshad-shah
          repositories: nimaz-data

      - name: Export the content-repo credential
        env:
          TOKEN: ${{ steps.nimaz-data-token.outputs.token }}
        run: |
          # Empty is fine and deliberate: the Gradle task treats a blank value as
          # absent and fails with a message naming how to supply one.
          echo "NIMAZ_DATA_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up ruby env
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Set execution flag for gradlew
        run: chmod +x gradlew

      # Cheap and first: the release version bump has no other coverage, and
      # getting it wrong is only visible after a full release build has been
      # spent and the Play upload is rejected as a duplicate version code.
      - name: Check the release version bump
        run: ruby fastlane/version_bump_spec.rb

      - name: Run Tests and Lint
        run: bundle exec fastlane android test

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/

      - name: Upload Lint Results
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html
