name: Android PR Checks

# An allowlist, not a `paths-ignore`: it fails closed. A new top-level directory gets no
# Gradle build until someone adds it here, which is the safe direction. Before this filter
# existed, a dependabot bump touching only worker/package.json ran the full test + lint +
# coverage lane (PR #520 is exactly that); worker/ has its own workflow, docs/ has
# docs_check.yml, and the theme files have tajweed_contrast_check.yml.
#
# **The filter is evaluated per push, not against the pull request's accumulated diff.** A
# `synchronize` event carrying only unlisted paths creates no run at all, so the PR's *head*
# ends up with no check runs against it even though the PR as a whole changes a thousand files
# under `app/**`. From the outside that is indistinguishable from checks that have not started
# yet. It happened on #596: a push touching only `.github/workflows/internal_testing.yml` left
# the head unverified, which is half of why that file is now on the list below.
on:
  pull_request:
    # `mm/**` and `epic/**` are here because a stacked PR targets the branch below it, not
    # dev. With only [ master, dev ] every PR in the 22-PR multi-module stack (#551) would
    # show green having run no build, no test and no lint at all.
    branches: [ master, dev, 'mm/**', 'epic/**' ]
    paths:
      - 'app/**'
      - 'baselineprofile/**'
      # The multi-module migration (#551) creates these; listing them before they exist is
      # harmless and stops a later PR in that stack from silently skipping this lane.
      - 'build-logic/**'
      - 'core/**'
      - 'feature/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      # The lane runs through fastlane and checks the version bump, so its own tooling counts.
      - 'fastlane/**'
      - 'Gemfile'
      - 'Gemfile.lock'
      # And so do the two workflows that drive that same tooling to build and ship this app.
      # A change to either used to merge with nothing checking it: `internal_testing.yml`
      # publishes to the Play internal track, `deploy.yml` publishes a release, and both call
      # the fastlane lanes already listed above. Leaving them off the list is the same gap as
      # leaving `fastlane/**` off would be.
      - '.github/workflows/internal_testing.yml'
      - '.github/workflows/deploy.yml'
      # Invoked by the coverage step below.
      - 'scripts/coverage_summary.py'
      # A new content artifact changes what the app builds against.
      - 'data.lock.json'
      - '.github/workflows/pr_checks.yml'

# A new push to the PR supersedes the old run. Without this every push to an open PR ran the
# full ~13-minute lane to completion: one branch pushed nine times in four and a half hours and
# paid for all nine. The sampled history contains zero cancelled runs, which is what a missing
# guard looks like from the outside.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The lane's median is ~13 minutes. Without a cap a hang bills toward the 6-hour default.
    timeout-minutes: 45
    # pull-requests: write is for the sticky coverage comment below. Without it the
    # comment step fails on a repository whose default token is read-only.
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The content artifact lives in a private repository. Mint a short-lived
      # installation token for it rather than carrying a long-lived PAT: the token
      # is scoped to nimaz-data, read-only, and expires in an hour. Same pattern as
      # the version-bump App above. See FetchNimazDataTask in build-logic (registered in
      # app/build.gradle.kts) and docs/CONTENT_REPO_AUTH.md.
      - name: Token for the content repository
        id: nimaz-data-token
        # Absent secrets must not fail the job here — let the build fail at
        # fetchNimazData instead, which prints the three ways to supply a credential.
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.NIMAZ_DATA_APP_ID }}
          private-key: ${{ secrets.NIMAZ_DATA_APP_PRIVATE_KEY }}
          owner: arshad-shah
          repositories: nimaz-data

      - name: Export the content-repo credential
        env:
          TOKEN: ${{ steps.nimaz-data-token.outputs.token }}
        run: |
          # Empty is fine and deliberate: the Gradle task treats a blank value as
          # absent and fails with a message naming how to supply one.
          echo "NIMAZ_DATA_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # This lane had no Gradle caching at all, which made `org.gradle.caching=true` in
      # gradle.properties a no-op here: the local build cache lives on the runner's disk and
      # the disk is destroyed when the job ends. Every PR therefore resolved the full
      # dependency graph and rebuilt from zero. android_instrumented_tests.yml has always done
      # this correctly; this is the same step.
      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up ruby env
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Set execution flag for gradlew
        run: chmod +x gradlew

      # Cheap and first: the release version bump has no other coverage, and
      # getting it wrong is only visible after a full release build has been
      # spent and the Play upload is rejected as a duplicate version code.
      - name: Check the release version bump
        run: ruby fastlane/version_bump_spec.rb

      - name: Run Tests and Lint
        run: bundle exec fastlane android test

      # Coverage is reported, never gated. jacocoTestReport already depends on
      # testDebugUnitTest, which the step above has run, so this is close to free.
      #
      # `!cancelled()` on all three, not `always()`. Still runs when a test *fails* —
      # that is exactly when you want to see what coverage did — but not when the run is
      # **cancelled**, which `always()` also covers and which is where this went wrong.
      #
      # The comment is sticky, so it is one comment edited in place rather than a new one
      # per run. `concurrency.cancel-in-progress` cancels this workflow the moment another
      # commit is pushed, and a cancelled run has no report: `coverage_summary.py` prints
      # "_No coverage report was produced for this run._" and the sticky step wrote that
      # over a perfectly good result from the previous head. Twice in one afternoon, and
      # both times it read as "coverage is broken" rather than "this run was superseded".
      # A superseded run should leave the last real number standing.
      - name: Coverage report
        if: ${{ !cancelled() }}
        run: ./gradlew :app:jacocoTestReport

      - name: Summarise coverage
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/coverage_summary.py \
            app/build/reports/jacoco/jacocoTestReport.xml > coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment coverage on the PR
        if: ${{ !cancelled() }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: coverage.md

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/

      - name: Upload Lint Results
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html
