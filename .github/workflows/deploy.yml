name: Android Build & Deploy

on:
  # Deploy only on a real push to dev (a merged change). Never on pull_request:
  # this lane uploads to the Play Store and bumps the version, which must not
  # happen for unreviewed PR code (and re-using a version code makes the upload
  # fail with "Version code N has already been used"). PRs are validated by the
  # Android PR Checks workflow instead.
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Credential for the private content repository the artifact is fetched from.
      # See gradle/nimaz-data.gradle.kts and data.lock.json. Without it the build
      # fails with an actionable message rather than a stack trace.
      NIMAZ_DATA_TOKEN: ${{ secrets.NIMAZ_DATA_TOKEN }}
    # Skip the automated version-bump commit so it never re-triggers a
    # build/deploy. That commit carries a [skip ci] marker in its message.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    permissions:
      contents: write
    steps:
      # Mint a short-lived installation token for a GitHub App. This is safer
      # than a long-lived PAT: the token auto-expires (~1h), is scoped to only
      # the permissions/repos granted to the App, and acts as the App's own bot
      # identity (which can be added to dev's branch-protection bypass list).
      # continue-on-error keeps PR/fork builds working when the App secrets are
      # unavailable; checkout then falls back to the default token.
      - name: Generate GitHub App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BUMP_APP_ID }}
          private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Build the PR's source branch on pull_request events, and the pushed
          # branch (dev) on push events. Authenticate with the App token so the
          # post-deploy version bump can be pushed back to the protected dev
          # branch; fall back to the default token if the App is absent (only
          # the final push step then fails).
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ steps.app-token.outputs.token || github.token }}
          lfs: true  # Enable Git LFS checkout

      - name: Checkout LFS objects
        run: git lfs checkout

      - name: Setup Git identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          slug='${{ steps.app-token.outputs.app-slug }}'
          if [ -n "$slug" ]; then
            # Attribute the bump commit to the App's bot user so it links to the App.
            uid="$(gh api "/users/${slug}[bot]" --jq .id)"
            git config --global user.name "${slug}[bot]"
            git config --global user.email "${uid}+${slug}[bot]@users.noreply.github.com"
          else
            git config --global user.name "CI-Bot"
            git config --global user.email "CI@bot.com"
          fi

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up ruby env
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Set execution flag for gradlew
        run: chmod +x gradlew

      - name: Decode Firebase Config
        uses: timheuer/base64-to-file@v1
        id: firebase_config
        with:
          fileName: "google-services.json"
          encodedString: ${{ secrets.FIREBASE_CONFIG }}

      - name: Move Firebase Config
        run: |
          mv ${{ steps.firebase_config.outputs.filePath }} app/google-services.json

      - name: Decode Service Account Key JSON File
        uses: timheuer/base64-to-file@v1
        id: service_account_json_file
        with:
          fileName: "serviceAccount.json"
          encodedString: ${{ secrets.PLAY_STORE_CONFIG_JSON }}

      - name: Decode Keystore File
        uses: timheuer/base64-to-file@v1
        id: android_keystore
        with:
          fileName: "android_keystore.keystore"
          encodedString: ${{ secrets.KEYSTORE_FILE }}

      - name: Build & deploy Android release
        run: bundle exec fastlane android deploy_internal
        env:
          KEYSTORE_FILE: ${{ steps.android_keystore.outputs.filePath }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS}}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ANDROID_JSON_KEY_FILE: ${{ steps.service_account_json_file.outputs.filePath }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4.6.0
        with:
          name: assets
          path: |
            ${{ github.workspace }}/app/build/outputs/bundle/release

      # The build above bumped versionCode/versionName in app/build.gradle.kts
      # (working tree only). Commit that change and push it straight back to the
      # protected dev branch so the committed baseline stays in sync for the next
      # deploy. This runs only on a real push to dev (a merged change).
      #
      # The push uses the GitHub App token (the App is allowed to bypass branch
      # protection), so no PR/manual merge is needed. The commit message carries a
      # [skip ci] marker so this push does not re-trigger the deploy workflow
      # (the job-level guard skips it). If dev advanced during the build, rebase
      # and retry so the push stays a fast-forward.
      - name: Commit and push version bump
        if: github.event_name == 'push'
        run: |
          git add app/build.gradle.kts
          if git diff --cached --quiet; then
            echo "No version change to commit; skipping."
            exit 0
          fi
          git commit -m "chore(release): bump version [skip ci]"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${{ github.ref_name }}"; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing on latest ${{ github.ref_name }} and retrying."
            git pull --rebase --autostash origin "${{ github.ref_name }}"
          done
          git push origin "HEAD:${{ github.ref_name }}"

      # Read the version that was just built/uploaded (and committed above) so
      # the tag and GitHub release name the exact published build.
      - name: Read released version
        id: version
        if: github.event_name == 'push'
        run: |
          name="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)"
          code="$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)"
          echo "name=$name"   >> "$GITHUB_OUTPUT"
          echo "code=$code"   >> "$GITHUB_OUTPUT"
          echo "tag=v$name"   >> "$GITHUB_OUTPUT"
          echo "Released versionName=$name versionCode=$code -> tag v$name"

      # Tag the bump commit (its tree holds exactly the published version) with
      # an annotated tag whose message is the Play Store changelog, giving an
      # auditable point that maps a git commit to a Play Store release. Skipped
      # if the tag already exists (e.g. a re-run with no fresh bump).
      - name: Create and push release tag
        id: tag
        if: github.event_name == 'push'
        run: |
          tag="${{ steps.version.outputs.tag }}"
          notes="fastlane/metadata/android/en-US/changelogs/default.txt"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists on origin; skipping tag + GitHub release."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag -a "$tag" -F "$notes"
          for attempt in 1 2 3; do
            if git push origin "refs/tags/$tag"; then
              echo "created=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Tag push failed (attempt $attempt); retrying."
            sleep $((attempt * 2))
          done
          git push origin "refs/tags/$tag"
          echo "created=true" >> "$GITHUB_OUTPUT"

      # Collect the signed artifacts produced by fastlane and rename them with
      # the version so the GitHub release assets are self-describing.
      - name: Stage release artifacts
        if: steps.tag.outputs.created == 'true'
        run: |
          set -e
          v="${{ steps.version.outputs.name }}"
          mkdir -p release-artifacts
          aab="$(find app/build/outputs/bundle/release -name '*.aab' | head -n1)"
          apk="$(find app/build/outputs/apk/release    -name '*.apk' | head -n1)"
          if [ -z "$aab" ]; then echo "::error::No signed .aab found"; exit 1; fi
          if [ -z "$apk" ]; then echo "::error::No signed .apk found"; exit 1; fi
          cp "$aab" "release-artifacts/Nimaz-v${v}.aab"
          cp "$apk" "release-artifacts/Nimaz-v${v}.apk"
          ls -la release-artifacts

      # Publish a GitHub release on the new tag: same changelog text shown on the
      # Play Store, with the signed .aab (the store upload) and a signed .apk
      # (sideloadable) attached.
      - name: Create GitHub release
        if: steps.tag.outputs.created == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Nimaz ${{ steps.version.outputs.tag }}
          body_path: fastlane/metadata/android/en-US/changelogs/default.txt
          files: |
            release-artifacts/Nimaz-v${{ steps.version.outputs.name }}.aab
            release-artifacts/Nimaz-v${{ steps.version.outputs.name }}.apk
          token: ${{ steps.app-token.outputs.token || github.token }}
