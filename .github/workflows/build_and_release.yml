name: Build and Release

# NOTE: This workflow builds an unsigned DEBUG APK only. It intentionally does
# NOT trigger on "v*" tags: signed releases for those tags (with Play Store
# changelog + signed .aab/.apk assets) are produced by the deploy workflow after
# a successful Play Store upload. Triggering here on v* would create duplicate,
# debug-only GitHub releases that collide with that flow.
on:
  push:
    branches:
      - release*
      - master

jobs:
  apk:
    name: Generate APK
    runs-on: ubuntu-latest
    steps:
      # The content artifact lives in a private repository. Mint a short-lived
      # installation token for it rather than carrying a long-lived PAT: the token
      # is scoped to nimaz-data, read-only, and expires in an hour. Same pattern as
      # the version-bump App above. See gradle/nimaz-data.gradle.kts.
      - name: Token for the content repository
        id: nimaz-data-token
        # Absent secrets must not fail the job here — let the build fail at
        # fetchNimazData instead, which prints the three ways to supply a credential.
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.NIMAZ_DATA_APP_ID }}
          private-key: ${{ secrets.NIMAZ_DATA_APP_PRIVATE_KEY }}
          owner: arshad-shah
          repositories: nimaz-data

      - name: Export the content-repo credential
        env:
          TOKEN: ${{ steps.nimaz-data-token.outputs.token }}
        run: |
          # Empty is fine and deliberate: the Gradle task treats a blank value as
          # absent and fails with a message naming how to supply one.
          echo "NIMAZ_DATA_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set execution flag for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: bash ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    name: Release APK
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The content artifact lives in a private repository. Mint a short-lived
      # installation token for it rather than carrying a long-lived PAT: the token
      # is scoped to nimaz-data, read-only, and expires in an hour. Same pattern as
      # the version-bump App above. See gradle/nimaz-data.gradle.kts.
      - name: Token for the content repository
        id: nimaz-data-token
        # Absent secrets must not fail the job here — let the build fail at
        # fetchNimazData instead, which prints the three ways to supply a credential.
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.NIMAZ_DATA_APP_ID }}
          private-key: ${{ secrets.NIMAZ_DATA_APP_PRIVATE_KEY }}
          owner: arshad-shah
          repositories: nimaz-data

      - name: Export the content-repo credential
        env:
          TOKEN: ${{ steps.nimaz-data-token.outputs.token }}
        run: |
          # Empty is fine and deliberate: the Gradle task treats a blank value as
          # absent and fails with a message naming how to supply one.
          echo "NIMAZ_DATA_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Download APK from build
        uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.run_number }}
          name: ${{ github.event.repository.name }} v${{ github.run_number }}
          files: app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
