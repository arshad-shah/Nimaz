name: Android Instrumentation Tests (emulator.wtf)

# Builds the app + instrumentation test APKs, then runs the androidTest suite
# (DB / notifications / workers / preferences / navigation flows) on emulator.wtf.
#
# Triggers:
#  - push to dev            → the canonical lane. This said `main` until 2026-08-10, and
#    since this repository's branches are `dev` and `master`, it had never once fired —
#    only `pull_request` was doing anything. See #461.
#  - pull_request (any base) → so it validates this branch's PR (and every future PR).
#
# The debug build needs no secrets: google-services.json is only required for the
# release/deploy lane, and the app's Firebase calls are guarded to no-op without it.
# The emulator.wtf step requires the EW_API_TOKEN repo secret. When the run *could* have
# had it and does not, the lane fails: a missing token used to downgrade "instrumented
# tests run on every PR" into "the APKs compiled" behind a green check, which is worse than
# not having the lane at all. Forks and dependabot cannot be given the secret, so those
# still skip with a warning — see the token step below.
#
# Paths are an allowlist and fail closed: a worker-only or docs-only change no longer
# builds two APKs and books cloud device time for code it did not touch. The two lists are
# duplicated rather than shared via a YAML anchor — GitHub Actions does not support
# anchors/aliases in workflow files. Keep them in sync.
on:
  push:
    branches: [ dev ]
    paths:
      - 'app/**'
      # The multi-module migration (#551) creates these; listing them before they exist is
      # harmless and stops a later PR in that stack from silently skipping this lane.
      - 'build-logic/**'
      - 'core/**'
      - 'feature/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'data.lock.json'
      - '.github/workflows/android_instrumented_tests.yml'
  pull_request:
    # No `branches:` filter, so stacked mm/** PRs already reach this lane.
    paths:
      - 'app/**'
      # The multi-module migration (#551) creates these; listing them before they exist is
      # harmless and stops a later PR in that stack from silently skipping this lane.
      - 'build-logic/**'
      - 'core/**'
      - 'feature/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'data.lock.json'
      - '.github/workflows/android_instrumented_tests.yml'

concurrency:
  group: ew-instrumentation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write          # mikepenz/action-junit-report publishes a check run
  pull-requests: write   # …and annotates the PR

jobs:
  instrumentation-tests:
    name: emulator.wtf instrumentation tests
    runs-on: ubuntu-latest
    # The emulator.wtf step has its own 20m cap, but the Gradle build before it had none.
    timeout-minutes: 45
    steps:
      # The content artifact lives in a private repository. Mint a short-lived
      # installation token for it rather than carrying a long-lived PAT: the token
      # is scoped to nimaz-data, read-only, and expires in an hour. Same pattern as
      # the version-bump App above. See FetchNimazDataTask in build-logic (registered in
      # app/build.gradle.kts) and docs/CONTENT_REPO_AUTH.md.
      - name: Token for the content repository
        id: nimaz-data-token
        # Absent secrets must not fail the job here — let the build fail at
        # fetchNimazData instead, which prints the three ways to supply a credential.
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.NIMAZ_DATA_APP_ID }}
          private-key: ${{ secrets.NIMAZ_DATA_APP_PRIVATE_KEY }}
          owner: arshad-shah
          repositories: nimaz-data

      - name: Export the content-repo credential
        env:
          TOKEN: ${{ steps.nimaz-data-token.outputs.token }}
        run: |
          # Empty is fine and deliberate: the Gradle task treats a blank value as
          # absent and fails with a message naming how to supply one.
          echo "NIMAZ_DATA_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The prepackaged Room DB (app/.../nimaz_prepopulated.db) and other *.db
          # assets are stored via Git LFS (.gitattributes: *.db filter=lfs). Without
          # this the APK packages the LFS pointer text instead of the real database,
          # and every test that opens the DB fails with "no such table".
          lfs: true

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Set execution flag for gradlew
        run: chmod +x gradlew

      # ── Artifacts: build the app APK and the instrumentation test APK ────────
      # assembleDebugAndroidTest also compiles + KSP-processes the entire
      # androidTest source set, so this step doubles as the compile check for the
      # Hilt test components and Room/Compose test wiring.
      - name: Build app and test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error

      # ── The token is required, except where GitHub cannot supply it ──────────
      # (the `secrets` context can't be used directly in an `if:`, so resolve it into a step
      # output here; the value is masked in logs).
      #
      # A missing token used to skip the cloud run with a warning and leave the job green.
      # That is the failure mode where the lane looks like it is guarding every PR while
      # actually asserting nothing but "the APKs compiled" — and a warning annotation is not
      # something anyone reads on a passing run. So: fail.
      #
      # The exception is a run that could never have had the secret. GitHub withholds repo
      # secrets from fork PRs and gives Dependabot a separate store, so those runs are not
      # misconfigured and there is nothing their author can do. They skip, loudly, and the
      # build+upload above still proves the androidTest source set compiles.
      - name: Check emulator.wtf token
        id: ew
        env:
          EW_API_TOKEN: ${{ secrets.EW_API_TOKEN }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork || false }}
          IS_DEPENDABOT: ${{ github.actor == 'dependabot[bot]' }}
        run: |
          if [ -n "$EW_API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$IS_FORK" = "true" ] || [ "$IS_DEPENDABOT" = "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=emulator.wtf skipped::EW_API_TOKEN is not available to fork or Dependabot pull requests. The APKs were built and uploaded, but the instrumentation suite did not run."
            exit 0
          fi
          echo "::error title=emulator.wtf token missing::EW_API_TOKEN is not set, so the instrumentation suite cannot run. This lane is the only thing running the androidTest suite, so it fails rather than passing without it. Add the secret in Settings → Secrets and variables → Actions."
          exit 1

      # ── Route the built APKs to emulator.wtf and run the suite ───────────────
      - name: Run instrumentation tests on emulator.wtf
        if: steps.ew.outputs.enabled == 'true'
        uses: emulator-wtf/actions/run-tests@v1.0.1
        with:
          api-token: ${{ secrets.EW_API_TOKEN }}
          app: app/build/outputs/apk/debug/app-debug.apk
          test: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          # minSdk is 29, so the default Pixel2/api27 device would fail to install.
          # Pin a supported API level (>= 29).
          devices: |
            model=Pixel2,version=30
          # Split across parallel shards to keep wall-clock time down.
          num-shards: 2
          # Retry only the individual tests that fail, to absorb transient device-level
          # flakes (e.g. "Failed to inject touch input" when a synthetic tap lands on a
          # just-scrolled list item at the viewport edge). A genuine failure still fails
          # after the retries.
          num-flaky-test-attempts: 2
          timeout: 20m
          record-video: true
          outputs-dir: build/test-results

      - name: Publish test report
        uses: mikepenz/action-junit-report@v6
        if: always() && steps.ew.outputs.enabled == 'true'
        with:
          report_paths: 'build/test-results/**/*.xml'
          check_name: emulator.wtf instrumentation results

      - name: Upload emulator.wtf outputs
        uses: actions/upload-artifact@v4
        if: always() && steps.ew.outputs.enabled == 'true'
        with:
          name: emulator-wtf-results
          path: build/test-results
          if-no-files-found: ignore
