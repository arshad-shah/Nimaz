name: Tajweed Data Checks

# Validates the tajweed data pipeline (issue #292) on PRs that touch the data
# scripts or JSON sources. Runs the pure-data checks in-memory over the JSON
# sources — no Git-LFS DB checkout needed — plus the pre-parser unit tests.
# Scoped to nimaz-pro-data/** so it never runs for unrelated changes.
on:
  push:
    branches: [ dev ]
    paths: [ 'nimaz-pro-data/**' ]
  pull_request:
    paths: [ 'nimaz-pro-data/**' ]

jobs:
  verify:
    name: Verify tajweed data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pre-parser unit tests
        run: python3 -m unittest discover -s nimaz-pro-data/scripts/tests -v

      - name: Orthography invariant (#290)
        run: python3 nimaz-pro-data/scripts/verify_tajweed_orthography.py

      - name: Tajweed validation harness (#292)
        run: python3 nimaz-pro-data/scripts/verify_tajweed.py
