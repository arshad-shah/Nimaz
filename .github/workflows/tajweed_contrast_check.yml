name: Tajweed Contrast Check

# Verifies every tajweed rule colour keeps >= 4.5:1 contrast against the reader
# background in both themes (issue #294). Pure Python — no Android toolchain —
# so it runs fast on any PR that touches the theme colours.
on:
  push:
    branches: [ dev ]
    paths:
      # Palette.kt and Color.kt landed in :core:ui in #561 (PR 10 of #551). `core/**` was added
      # ahead of that move so this lane would not silently stop firing, and it did keep firing —
      # the script's own hardcoded path is what broke, loudly. The old `app/...` entries are gone
      # because a filter that matches nothing reads like coverage and is not.
      - 'core/ui/src/main/kotlin/com/arshadshah/nimaz/presentation/theme/**'
      - 'core/**'
      - 'scripts/check_tajweed_contrast.py'
  pull_request:
    paths:
      # Palette.kt and Color.kt landed in :core:ui in #561 (PR 10 of #551). `core/**` was added
      # ahead of that move so this lane would not silently stop firing, and it did keep firing —
      # the script's own hardcoded path is what broke, loudly. The old `app/...` entries are gone
      # because a filter that matches nothing reads like coverage and is not.
      - 'core/ui/src/main/kotlin/com/arshadshah/nimaz/presentation/theme/**'
      - 'core/**'
      - 'scripts/check_tajweed_contrast.py'

jobs:
  contrast:
    name: Tajweed colour contrast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check tajweed colour contrast (>= 4.5:1)
        run: python3 scripts/check_tajweed_contrast.py
